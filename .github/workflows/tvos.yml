name: tvOS (unsigned simulator + Apple TV device builds)
on:
  push:
    branches: [main, dev, experiment/home-performance-focus-20261120]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tvos-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - name: Check out source
        uses: actions/checkout@v5
      - name: Validate localization resources
        run: python3 scripts/check_localizations.py
      - name: Select Xcode 26.2 with installed tvOS runtime
        run: |
          sudo xcode-select -s /Applications/Xcode_26.2.app/Contents/Developer
          xcodebuild -version
          xcrun --sdk appletvsimulator --show-sdk-version
          xcrun simctl list runtimes
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate Xcode project
        run: xcodegen generate
      - name: Verify embedded Git revision matches the checkout
        run: |
          test -f TypeTypeTV/TVBuildInfo.generated.swift
          grep -Fq "static let gitRevision = \"$(git rev-parse HEAD)\"" TypeTypeTV/TVBuildInfo.generated.swift
      - name: Build tvOS simulator app (no Apple identity needed)
        run: |
          set -euo pipefail
          xcodebuild \
            -project TypeTypeTV.xcodeproj \
            -scheme TypeTypeTV \
            -configuration Debug \
            -sdk appletvsimulator \
            -destination 'generic/platform=tvOS Simulator' \
            -derivedDataPath "$RUNNER_TEMP/typetype-build" \
            CODE_SIGNING_ALLOWED=NO \
            build
          cd "$RUNNER_TEMP/typetype-build/Build/Products/Debug-appletvsimulator"
          zip -qry "$GITHUB_WORKSPACE/TypeTypeTV-simulator.app.zip" TypeTypeTV.app
      - name: Compile native Apple TV device target without signing
        run: |
          set -euo pipefail
          # Catch arm64/tvOS-only SDK or linker failures before the user
          # spends time provisioning their Apple TV with a free Apple ID.
          # This is a compile check only; installation still requires signing.
          xcodebuild \
            -project TypeTypeTV.xcodeproj \
            -scheme TypeTypeTV \
            -configuration Debug \
            -sdk appletvos \
            -destination 'generic/platform=tvOS' \
            -derivedDataPath "$RUNNER_TEMP/typetype-device-build" \
            CODE_SIGNING_ALLOWED=NO \
            build
      - name: Compile Release Apple TV device target without signing
        run: |
          set -euo pipefail
          # Compile out DEBUG-only playback probes and catch Release-only issues.
          xcodebuild \
            -project TypeTypeTV.xcodeproj \
            -scheme TypeTypeTV \
            -configuration Release \
            -sdk appletvos \
            -destination 'generic/platform=tvOS' \
            -derivedDataPath "$RUNNER_TEMP/typetype-release-build" \
            CODE_SIGNING_ALLOWED=NO \
            build
      - name: Upload unsigned simulator build
        uses: actions/upload-artifact@v6
        with:
          name: TypeTypeTV-tvos-simulator-unsigned
          path: TypeTypeTV-simulator.app.zip
          if-no-files-found: error
          retention-days: 7
      - name: Run native contract/unit and tvOS UI tests
        run: |
          set -euo pipefail
          # Three native-focus tests require separate XCTest sessions on tvOS 26.2.
          # Keep them mandatory below; do not retry failures or loosen assertions.
          xcodebuild \
            -project TypeTypeTV.xcodeproj \
            -scheme TypeTypeTV \
            -configuration Debug \
            -sdk appletvsimulator \
            -destination 'platform=tvOS Simulator,name=Apple TV 4K (3rd generation),OS=26.2' \
            -derivedDataPath "$RUNNER_TEMP/typetype-build" \
            CODE_SIGNING_ALLOWED=NO \
            -resultBundlePath "$RUNNER_TEMP/typetype-tests.xcresult" \
            -skip-testing:TypeTypeTVUITests/TypeTypeTVUITests/testChannelVideoFocusReturnsToSavedTileFromBothRails \
            -skip-testing:TypeTypeTVUITests/TypeTypeTVUITests/testContentSettingsLeftFromSubnavigationRevealsMainSettings \
            -skip-testing:TypeTypeTVUITests/TypeTypeTVUITests/testLeftFromSettingsSubrailFocusesGlobalSettingsWithoutAccountFlash \
            test
      - name: Verify focus regressions in independent tvOS XCTest sessions
        run: |
          set -euo pipefail
          # On the shared runner, these sometimes inherit a stale UIKit focus
          # owner from unrelated UI tests. Separate xcodebuild invocations
          # keep the exact first-press navigation assertions, without retries
          # or artificial delays. The About test passed 8/8 in isolation.
          for test_name in \
            testChannelVideoFocusReturnsToSavedTileFromBothRails \
            testContentSettingsLeftFromSubnavigationRevealsMainSettings \
            testLeftFromSettingsSubrailFocusesGlobalSettingsWithoutAccountFlash
          do
            xcodebuild \
              -project TypeTypeTV.xcodeproj \
              -scheme TypeTypeTV \
              -configuration Debug \
              -sdk appletvsimulator \
              -destination 'platform=tvOS Simulator,name=Apple TV 4K (3rd generation),OS=26.2' \
              -derivedDataPath "$RUNNER_TEMP/typetype-build" \
              CODE_SIGNING_ALLOWED=NO \
              -resultBundlePath "$RUNNER_TEMP/typetype-focus-$test_name.xcresult" \
              "-only-testing:TypeTypeTVUITests/TypeTypeTVUITests/$test_name" \
              test
          done
      - name: Export first-run UI screenshots
        if: always()
        run: |
          if [ -d "$RUNNER_TEMP/typetype-tests.xcresult" ]; then
            xcrun xcresulttool export attachments \
              --path "$RUNNER_TEMP/typetype-tests.xcresult" \
              --output-path "$GITHUB_WORKSPACE/tvos-ui-screenshots" || true
          fi
          for bundle in "$RUNNER_TEMP"/typetype-focus-*.xcresult; do
            [ -d "$bundle" ] || continue
            name="$(basename "$bundle" .xcresult)"
            xcrun xcresulttool export attachments \
              --path "$bundle" \
              --output-path "$GITHUB_WORKSPACE/tvos-ui-screenshots/$name" || true
          done
      - name: Upload UI screenshot artifacts
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: TypeTypeTV-ui-screenshots
          path: tvos-ui-screenshots
          if-no-files-found: warn
          retention-days: 7
