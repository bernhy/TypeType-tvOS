name: TypeTypeTV
options:
  bundleIdPrefix: org.example
  deploymentTarget:
    tvOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    CODE_SIGN_STYLE: Automatic
    TARGETED_DEVICE_FAMILY: "3"
targets:
  TypeTypeTV:
    type: application
    platform: tvOS
    deploymentTarget: "17.0"
    sources:
      - TypeTypeTV
    info:
      path: TypeTypeTV/Info.plist
      properties:
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        CFBundleDisplayName: TypeType
        CFBundleDevelopmentRegion: de
        UIRequiresFullScreen: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.example.typetype.tv
        INFOPLIST_KEY_CFBundleDisplayName: "TypeType"
        INFOPLIST_KEY_UIRequiresFullScreen: YES
        ASSETCATALOG_COMPILER_GENERATE_SWIFT_ASSET_SYMBOL_EXTENSIONS: NO
  TypeTypeTVTests:
    type: bundle.unit-test
    platform: tvOS
    deploymentTarget: "17.0"
    sources:
      - TypeTypeTVTests
    dependencies:
      - target: TypeTypeTV
  TypeTypeTVUITests:
    type: bundle.ui-testing
    platform: tvOS
    deploymentTarget: "17.0"
    sources:
      - TypeTypeTVUITests
    dependencies:
      - target: TypeTypeTV
    settings:
      base:
        TEST_TARGET_NAME: TypeTypeTV
schemes:
  TypeTypeTV:
    build:
      targets:
        TypeTypeTV: all
    run:
      config: Debug
    test:
      targets:
        - TypeTypeTVTests
        - TypeTypeTVUITests
